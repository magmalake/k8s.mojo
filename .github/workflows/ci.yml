name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, nightly and by hand (Actions > CI > Run workflow), not on
  # PRs or main: GitHub's hosted macOS pool is short on capacity, and a job
  # that never gets a runner fails the required `ci` gate.
  schedule:
    - cron: '33 7 * * *'
  workflow_dispatch:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs; the unit tests run
      # here instead, in the stable environment a consumer gets.
      task: unit
      env: default

  unit:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    name: ${{ matrix.env == 'default' && 'stable' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        env: [default, nightly]
    defaults:
      run:
        working-directory: k8s.mojo
    steps:
      - uses: actions/checkout@v4
        with:
          path: k8s.mojo
      # The nightly compiles flare, json and threads from checkouts next to
      # this one, at the revisions pixi.toml pins for stable.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with: {repository: magmalake/flare_mlake, ref: b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8, path: flare_mlake}
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with: {repository: magmalake/json_mlake, ref: 27c05c1c0c2881abfb33ce8eefae4d44d8b602a9, path: json_mlake}
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with: {repository: magmalake/threads.mojo, ref: f45e780a8de77278c140cee36904e46e93e0ca1c, path: threads.mojo}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}
          manifest-path: k8s.mojo/pixi.toml
      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} unit

  # The calls against a live cluster: kind on the runner's docker.
  kind:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
      - name: Pods, services and jobs on a kind cluster
        run: pixi run kind

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fmt
      - name: mojo format leaves the tree unchanged
        run: pixi run -e fmt format-check

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [release, release-check, unit, kind, format]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
